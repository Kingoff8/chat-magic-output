<!doctype html>
<html lang="ru" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script>
  try {
    var f = new URLSearchParams(location.search).get("theme");
    if (f) document.documentElement.dataset.theme = f;
  } catch (e) {}
</script>
<!-- __CSS__ = demo.html <style> (single source of truth for the look) + prose.css -->
<style>__CSS__</style>
<style>
  /* template-only structural tweaks — no palette / element duplication */
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--ok); font-weight: 600; font-size: 13px; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(.8); opacity: .6; } 50% { transform: scale(1.25); opacity: 1; } }
  main > .prose.card { padding: 40px 44px; }
  .prose code { white-space: normal; }
  @media (max-width: 640px) { main > .prose.card { padding: 26px 20px; } }
</style>
</head>
<body>

<div class="bg">
  <div class="blob blob-1" data-depth="0.06"></div>
  <div class="blob blob-2" data-depth="0.1"></div>
  <div class="blob blob-3" data-depth="0.14"></div>
</div>

<nav>
  <div class="logo">chat-magic-<span>output</span></div>
  <span class="live"><span class="dot"></span>live</span>
  <div class="spacer"></div>
  <a href="https://github.com/Kingoff8/chat-magic-output">github</a>
</nav>

<main>
  <article class="prose card" id="doc">Загрузка…</article>
</main>

<footer>
  Отрендерено скиллом <a href="https://github.com/Kingoff8/chat-magic-output">chat-magic-output</a> ·
  стиль demo.html · палитра <b id="pal">__THEME__</b>
</footer>

<script id="src" type="application/octet-stream" data-b64="__B64__"></script>
<script>
(function () {
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- markdown → html ---------- */
  var b64 = document.getElementById("src").getAttribute("data-b64") || "";
  var md;
  try {
    md = new TextDecoder().decode(Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }));
  } catch (e) { md = ""; }

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>")
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function splitRow(l) {
    return l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (s) { return s.trim(); });
  }
  function calloutVariant(t) {
    if (/✅/.test(t)) return "ok";
    if (/⚠️|⚠/.test(t)) return "warn";
    if (/❌/.test(t)) return "err";
    return "info";
  }
  function render(src) {
    var lines = src.replace(/\r\n/g, "\n").split("\n");
    var out = "", i = 0, inCode = false, lang = "", buf = [];

    function flushCode() {
      if (!inCode) return;
      out += '<div class="codeblock"><div class="cb-head"><span class="cb-lang">' + esc(lang || "text") +
             '</span><button class="cb-copy" type="button">Копировать</button></div>' +
             '<pre><code class="lang-' + esc(lang) + '">' + esc(buf.join("\n")) + "</code></pre></div>";
      inCode = false; buf = [];
    }

    while (i < lines.length) {
      var line = lines[i];

      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) { if (!inCode) { inCode = true; lang = fence[1] || ""; } else { flushCode(); } i++; continue; }
      if (inCode) { buf.push(line); i++; continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out += "<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"; i++; continue; }

      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { out += "<hr>"; i++; continue; }

      if (/^>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
        var v = calloutVariant(q.join(" "));
        out += '<div class="callout callout-block ' + v + '">' +
               q.map(function (t) { return "<p>" + inline(t) + "</p>"; }).join("") + "</div>";
        continue;
      }

      if (line.indexOf("|") > -1 && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
        var head = splitRow(line); i += 2; var rows = [];
        while (i < lines.length && lines[i].indexOf("|") > -1 && lines[i].trim() !== "") { rows.push(splitRow(lines[i])); i++; }
        out += '<div class="table-wrap"><table><thead><tr>' +
               head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") +
               "</tr></thead><tbody>" +
               rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
               "</tbody></table></div>";
        continue;
      }

      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        var ordered = /^\s*\d+\.\s+/.test(line), items = [];
        while (i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))) {
          items.push(lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/, "")); i++;
        }
        var tag = ordered ? "ol" : "ul";
        out += "<" + tag + ">" + items.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</" + tag + ">";
        continue;
      }

      if (line.trim() === "") { i++; continue; }

      var para = [];
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^(#{1,6}\s|```|>\s?)/.test(lines[i]) &&
             !/^\s*(-{3,}|\*{3,})\s*$/.test(lines[i]) &&
             lines[i].indexOf("|") === -1 &&
             !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])) { para.push(lines[i]); i++; }
      if (para.length) out += "<p>" + inline(para.join(" ")) + "</p>";
      else i++;
    }
    flushCode();
    return out;
  }

  var doc = document.getElementById("doc");
  doc.innerHTML = render(md);
  document.getElementById("pal").textContent = document.documentElement.dataset.theme;

  /* ---------- copy buttons ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".cb-copy") : null;
    if (!b) return;
    var code = b.closest(".codeblock").querySelector("pre code");
    navigator.clipboard.writeText(code.innerText).then(function () {
      b.textContent = "Скопировано ✓";
      setTimeout(function () { b.textContent = "Копировать"; }, 1500);
    }, function () { b.textContent = "Не удалось"; });
  });

  /* ---------- live reveal (demo .reveal class comes from the demo stylesheet) ---------- */
  var kids = Array.prototype.slice.call(doc.children);
  kids.forEach(function (el, idx) { el.classList.add("reveal"); el.style.transitionDelay = Math.min(idx * 0.04, 0.4) + "s"; });
  if (reduceMotion) {
    kids.forEach(function (el) { el.classList.add("in"); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
    }, { threshold: 0.12 });
    kids.forEach(function (el) { io.observe(el); });
    /* safety net: content must be visible even if reveal never fires */
    setTimeout(function () { kids.forEach(function (el) { el.classList.add("in"); }); }, 2000);
  }

  /* ---------- background parallax ---------- */
  if (!reduceMotion) {
    var blobs = Array.prototype.slice.call(document.querySelectorAll(".blob"));
    var tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener("mousemove", function (e) {
      tx = e.clientX - window.innerWidth / 2;
      ty = e.clientY - window.innerHeight / 2;
    });
    (function tick() {
      cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
      blobs.forEach(function (b) {
        var d = parseFloat(b.dataset.depth || "0.1");
        b.style.transform = "translate(" + cx * d + "px," + cy * d + "px)";
      });
      requestAnimationFrame(tick);
    })();
  }
})();
</script>
</body>
</html>
