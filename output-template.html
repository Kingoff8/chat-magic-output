<!doctype html>
<html lang="ru" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script>
  try {
    var f = new URLSearchParams(location.search).get("theme");
    if (f) document.documentElement.dataset.theme = f;
  } catch (e) {}
</script>
<!-- __CSS__ = demo.html <style> (single source of truth for the look) + prose.css -->
<style>__CSS__</style>
<style>
  /* template-only structural + swap-animation tweaks */
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--ok); font-weight: 600; font-size: 13px; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 1.8s ease-in-out infinite; }
  .live.off { color: var(--muted); }
  .live.off .dot { background: var(--muted); animation: none; }
  .live.busy { color: var(--accent); }
  .live.busy .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .phase { color: var(--accent); font-weight: 600; font-size: 13px; }
  @keyframes pulse { 0%, 100% { transform: scale(.8); opacity: .6; } 50% { transform: scale(1.25); opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }

  /* индикатор загрузки в начале вывода */
  .loader { display: flex; align-items: center; gap: 12px; padding: 4px 0 24px; color: var(--muted); font-size: 14px; }
  .loader .ring {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    border: 2px solid color-mix(in srgb, var(--accent) 28%, transparent);
    border-top-color: var(--accent);
    animation: spin .9s linear infinite;
  }
  .loader .dots { display: inline-flex; gap: 4px; }
  .loader .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s ease-in-out infinite; }
  .loader .dots i:nth-child(2) { animation-delay: .15s; }
  .loader .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .45; } 40% { transform: scale(1); opacity: 1; } }

  /* «очень медленное» растворение старого вывода при начале работы */
  #doc > *.__slow {
    transition-duration: 20s !important;
    transition-timing-function: cubic-bezier(.45, .05, .55, .95) !important;
    filter: blur(10px);
  }

  /* курсор набора в конце последнего блока */
  #doc > .typing::after {
    content: "▋"; color: var(--accent); margin-left: 3px;
    animation: blink 1s steps(2, start) infinite;
  }

  main > .prose.card { padding: 40px 44px; }
  .prose code { white-space: normal; }

  /* ---- animated content swap: old fades out top→down, new fades in ---- */
  #doc > * { transition: opacity .38s ease, transform .38s ease, filter .38s ease; }
  #doc > *.__out { opacity: 0; transform: translateY(-12px); filter: blur(2px); }
  #doc > *.__in  { opacity: 0; transform: translateY(16px); }
  #doc > *.__in.__show { opacity: 1; transform: none; filter: none; }

  @media (max-width: 640px) { main > .prose.card { padding: 26px 20px; } }
  @media (prefers-reduced-motion: reduce) {
    #doc > * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="blob blob-1" data-depth="0.06"></div>
  <div class="blob blob-2" data-depth="0.1"></div>
  <div class="blob blob-3" data-depth="0.14"></div>
</div>

<nav>
  <div class="logo">chat-magic-<span>output</span></div>
  <span class="live off" id="live"><span class="dot"></span><span id="liveText">offline</span></span>
  <span class="phase" id="phase"></span>
  <div class="spacer"></div>
  <span id="stamp"></span>
  <a href="#" id="replay">повторить</a>
  <a href="#" id="refresh">обновить</a>
  <a href="https://github.com/Kingoff8/chat-magic-output">github</a>
</nav>

<main>
  <article class="prose card" id="doc">Загрузка…</article>
</main>

<footer>
  Отрендерено скиллом <a href="https://github.com/Kingoff8/chat-magic-output">chat-magic-output</a> ·
  стиль demo.html · палитра <b id="pal">__THEME__</b>
</footer>

<script id="src" type="application/octet-stream" data-b64="__B64__"></script>
<script>
(function () {
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var doc = document.getElementById("doc");
  var LS = "cmo:last-html";
  var STEP_OUT = 0.035;   // stagger per block, seconds
  var STEP_IN  = 0.05;
  var DURATION = 0.38;

  /* ---------------- markdown → html ---------------- */
  var b64 = document.getElementById("src").getAttribute("data-b64") || "";
  var md = "";
  try {
    md = new TextDecoder().decode(Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }));
  } catch (e) {}

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>")
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function splitRow(l) {
    return l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (s) { return s.trim(); });
  }
  function calloutVariant(t) {
    if (/✅/.test(t)) return "ok";
    if (/⚠/.test(t)) return "warn";
    if (/❌/.test(t)) return "err";
    return "info";
  }
  /* абзац, начинающийся со статуса → .callout, эмодзи уходит в заголовок */
  function statusCallout(text) {
    var m = text.match(/^([✅⚠️❌ℹ️])\s*([\s\S]*)$/);
    if (!m) return null;
    var emoji = m[1], rest = m[2], idx = -1;
    [" — ", ": ", ". "].forEach(function (sep) {
      var p = rest.indexOf(sep);
      if (p > 4 && (idx === -1 || p < idx)) idx = p;
    });
    var title = idx === -1 ? rest : rest.slice(0, idx);
    var body = idx === -1 ? "" : rest.slice(idx).replace(/^\s*(—|:|\.)\s*/, "");
    if (!title) return null;
    return '<div class="callout callout-block ' + calloutVariant(emoji) + '">' +
           '<p class="callout-title">' + inline(emoji + " " + title) + "</p>" +
           (body ? "<p>" + inline(body) + "</p>" : "") + "</div>";
  }
  function render(src) {
    var lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
    var out = "", i = 0, inCode = false, lang = "", buf = [];

    function flushCode() {
      if (!inCode) return;
      out += '<div class="codeblock"><div class="cb-head"><span class="cb-lang">' + esc(lang || "text") +
             '</span><button class="cb-copy" type="button">Копировать</button></div>' +
             '<pre><code class="lang-' + esc(lang) + '">' + esc(buf.join("\n")) + "</code></pre></div>";
      inCode = false; buf = [];
    }

    while (i < lines.length) {
      var line = lines[i];

      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) { if (!inCode) { inCode = true; lang = fence[1] || ""; } else { flushCode(); } i++; continue; }
      if (inCode) { buf.push(line); i++; continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out += "<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"; i++; continue; }

      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { out += "<hr>"; i++; continue; }

      if (/^>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
        out += '<div class="callout callout-block ' + calloutVariant(q.join(" ")) + '">' +
               q.map(function (t, k) {
                 return k === 0 ? '<p class="callout-title">' + inline(t) + "</p>" : "<p>" + inline(t) + "</p>";
               }).join("") + "</div>";
        continue;
      }

      if (line.indexOf("|") > -1 && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
        var head = splitRow(line); i += 2; var rows = [];
        while (i < lines.length && lines[i].indexOf("|") > -1 && lines[i].trim() !== "") { rows.push(splitRow(lines[i])); i++; }
        out += '<div class="table-wrap"><table><thead><tr>' +
               head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
               rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
               "</tbody></table></div>";
        continue;
      }

      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        var ordered = /^\s*\d+\.\s+/.test(line), items = [];
        while (i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))) {
          items.push(lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/, "")); i++;
        }
        var tag = ordered ? "ol" : "ul";
        if (ordered && items.length <= 8 && items.every(function (t) { return t.length <= 120; })) {
          /* короткий нумерованный список → карточки-шаги (2 колонки) */
          out += '<div class="steps steps-2">' + items.map(function (t) {
            return '<div class="step"><h4>' + inline(t) + "</h4></div>";
          }).join("") + "</div>";
        } else {
          out += "<" + tag + ">" + items.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</" + tag + ">";
        }
        continue;
      }

      if (line.trim() === "") { i++; continue; }

      var para = [];
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^(#{1,6}\s|```|>\s?)/.test(lines[i]) &&
             !/^\s*(-{3,}|\*{3,})\s*$/.test(lines[i]) &&
             lines[i].indexOf("|") === -1 &&
             !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])) { para.push(lines[i]); i++; }
      if (para.length) {
        var text = para.join(" ");
        out += statusCallout(text) || ("<p>" + inline(text) + "</p>");
      } else i++;
    }
    flushCode();
    return out;
  }

  /* ---------------- animated swap ---------------- */
  function show(html, animateIn) {
    doc.innerHTML = html;
    if (!animateIn || reduceMotion) return;
    var blocks = Array.prototype.slice.call(doc.children);
    blocks.forEach(function (el, i) {
      el.classList.add("__in");
      el.style.transitionDelay = Math.min(i * STEP_IN, 0.6) + "s";
    });
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        blocks.forEach(function (el) { el.classList.add("__show"); });
      });
    });
    /* страховка: контент обязан быть видимым, даже если rAF/transition не сработали */
    setTimeout(function () {
      blocks.forEach(function (el) { el.classList.add("__show"); });
    }, 1200);
  }

  function swapTo(html) {
    if (reduceMotion) { show(html, false); return; }
    var old = Array.prototype.slice.call(doc.children);
    old.forEach(function (el, i) {
      el.style.transitionDelay = Math.min(i * STEP_OUT, 0.5) + "s";
      el.classList.add("__out");
    });
    var wait = Math.max(DURATION * 1000, Math.min(old.length * STEP_OUT, 0.5) * 1000 + DURATION * 1000);
    setTimeout(function () { show(html, true); }, wait);
  }

  function remember(html) {
    try { localStorage.setItem(LS, html); } catch (e) {}
  }
  function recall() {
    try { return localStorage.getItem(LS); } catch (e) { return null; }
  }

  function stamp() {
    var d = new Date();
    document.getElementById("stamp").textContent =
      "обновлено " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0");
  }

  var currentHtml = render(md);
  var previousHtml = recall();

  function boot(st) {
    if (st === "thinking") {
      show(currentHtml, false);   /* уже думаем — сразу растворяем */
      setPhase("думает…");
      dissolve();
    } else if (previousHtml && previousHtml !== currentHtml) {
      doc.innerHTML = previousHtml;
      swapTo(currentHtml);
    } else {
      show(currentHtml, true);
    }
    remember(currentHtml);
    stamp();
    document.getElementById("pal").textContent = document.documentElement.dataset.theme;
  }

  /* ---------------- живой режим: состояние + потоковая выдача ---------------- */
  var canPoll = location.protocol !== "file:";
  var lastMd = md;
  var liveEl = document.getElementById("live");
  var liveText = document.getElementById("liveText");
  var phaseEl = document.getElementById("phase");
  var state = "";
  var afterThinking = false;

  function setPhase(name) {
    if (phaseEl) phaseEl.textContent = name || "";
    if (liveEl) liveEl.classList.toggle("busy", name === "думает…");
  }
  function markTyping() {
    stopTyping();
    if (doc.lastElementChild) doc.lastElementChild.classList.add("typing");
  }
  function stopTyping() {
    Array.prototype.slice.call(doc.querySelectorAll(".typing")).forEach(function (el) {
      el.classList.remove("typing");
    });
  }
  /* очень медленное растворение старого вывода */
  function showLoader(text) {
    var el = document.createElement("div");
    el.className = "loader";
    el.innerHTML = '<span class="ring"></span><span class="loader-text">' +
      (text || "Формирую ответ…") + '</span><span class="dots"><i></i><i></i><i></i></span>';
    return el;
  }
  function ensureLoader(text) {
    var el = doc.querySelector(".loader");
    if (el) return el;
    el = showLoader(text);
    doc.insertBefore(el, doc.firstChild);
    el.classList.add("__in");
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add("__show"); }); });
    return el;
  }
  function hideLoader() {
    var el = doc.querySelector(".loader");
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }
  function dissolve() {
    var ob = Array.prototype.slice.call(doc.children).filter(function (el) {
      return !el.classList.contains("loader");
    });
    ob.forEach(function (el) { el.classList.remove("__out"); });
    void doc.offsetWidth;              /* форсируем reflow, иначе переход не стартует */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        ob.forEach(function (el, i) {
          el.classList.add("__slow");
          el.style.transitionDelay = Math.min(i * 0.25, 2.5) + "s";
          el.classList.add("__out");
        });
        ensureLoader(state === "writing" ? "Формирую ответ…" : "Думаю…");
      });
    });
  }
  /* достраивание по мере вывода: текущий блок меняется на месте, новые проявляются */
  function incremental(html) {
    var tmp = document.createElement("div");
    tmp.innerHTML = html;
    var nb = Array.prototype.slice.call(tmp.children);
    var ob = Array.prototype.slice.call(doc.children);
    var n = Math.min(ob.length, nb.length), i = 0;
    while (i < n && ob[i].tagName === nb[i].tagName && ob[i].innerHTML === nb[i].innerHTML) i++;
    if (i < n) {
      if (ob[i].tagName === nb[i].tagName && /^(P|H1|H2|H3|H4|LI|UL|OL|HR|BLOCKQUOTE)$/.test(ob[i].tagName)) {
        ob[i].innerHTML = nb[i].innerHTML;
        i++;
      } else return false;
    }
    while (doc.children.length > i) doc.removeChild(doc.lastChild);
    nb.slice(i).forEach(function (el) {
      el.classList.add("__in");
      el.style.transitionDuration = "0.45s";
      doc.appendChild(el);
      requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add("__show"); }); });
    });
    return true;
  }
  function getText(url) {
    return fetch(url + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .catch(function () { return null; });
  }

  if (canPoll) {
    liveEl.classList.remove("off");
    liveText.textContent = "live";
    setInterval(function () {
      getText("state.txt").then(function (s) {
        s = (s || "").trim();
        if (s !== state) {
          state = s;
          if (s === "thinking") { afterThinking = true; dissolve(); setPhase("думает…"); }
          else if (s === "writing") { stopTyping(); setPhase("печатает"); ensureLoader("Формирую ответ…"); }
          else if (s === "done") { stopTyping(); setPhase(""); }
        }
        return getText("answer.md");
      }).then(function (t) {
        if (!t || t === lastMd) return;
        lastMd = t;
        var html = render(t);
        if (html === currentHtml) return;
        currentHtml = html;
        remember(html);
        if (state === "thinking") return;
        if (afterThinking) { afterThinking = false; swapTo(html); }
        else if (!incremental(html)) swapTo(html);
        hideLoader();
        if (state === "writing") markTyping();
        stamp();
      });
    }, 600);
    getText("state.txt").then(function (s) { state = (s || "").trim(); boot(state); });
  } else {
    boot("");
    liveText.textContent = "offline · обновите страницу";
  }

  /* повтор анимации растворения — по кнопке, в любой момент */
  document.getElementById("replay").addEventListener("click", function (e) {
    e.preventDefault();
    var saved = currentHtml;
    dissolve();
    setTimeout(function () { swapTo(saved); }, 21500);
  });

  document.getElementById("refresh").addEventListener("click", function (e) { e.preventDefault(); location.reload(); });

  /* ---------------- copy buttons ---------------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".cb-copy") : null;
    if (!b) return;
    var code = b.closest(".codeblock").querySelector("pre code");
    navigator.clipboard.writeText(code.innerText).then(function () {
      b.textContent = "Скопировано ✓";
      setTimeout(function () { b.textContent = "Копировать"; }, 1500);
    }, function () { b.textContent = "Не удалось"; });
  });

  /* ---------------- background parallax ---------------- */
  if (!reduceMotion) {
    var blobs = Array.prototype.slice.call(document.querySelectorAll(".blob"));
    var tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener("mousemove", function (ev) {
      tx = ev.clientX - window.innerWidth / 2;
      ty = ev.clientY - window.innerHeight / 2;
    });
    (function tick() {
      cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
      blobs.forEach(function (b) {
        var d = parseFloat(b.dataset.depth || "0.1");
        b.style.transform = "translate(" + cx * d + "px," + cy * d + "px)";
      });
      requestAnimationFrame(tick);
    })();
  }
})();
</script>
</body>
</html>
